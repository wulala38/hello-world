<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机密码生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 py-12 px-4">
  <div class="max-w-2xl mx-auto">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
        <i data-lucide="lock" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-4xl font-bold text-white mb-2">随机密码生成器</h1>
      <p class="text-slate-400 text-lg">生成安全、高强度的随机密码</p>
    </div>

    <div class="bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
      <div class="p-6 border-b border-slate-700 bg-slate-800/50">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-sm font-medium text-slate-400">密码强度</span>
          <div class="flex gap-1">
            <div id="strengthBar" class="w-full h-2 rounded-full transition-all bg-gray-300" style="width: 100px;"></div>
          </div>
          <span id="strengthLabel" class="text-sm font-semibold text-white">无</span>
        </div>
        
        <div class="flex items-center gap-4 bg-slate-900 rounded-xl p-4 mb-4">
          <div class="flex-1">
            <input id="passwordDisplay" type="text" readonly class="w-full bg-transparent border-none outline-none text-2xl font-mono text-white placeholder-slate-600" placeholder="点击生成密码" />
          </div>
          <button id="copyBtn" class="p-3 rounded-xl hover:bg-slate-700 transition-colors group relative">
            <i data-lucide="copy" class="w-6 h-6 text-slate-400 group-hover:text-white"></i>
          </button>
          <button id="generateBtn" class="p-3 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl hover:from-blue-500 hover:to-indigo-500 transition-all shadow-lg shadow-blue-500/25">
            <i data-lucide="refresh-cw" class="w-6 h-6 text-white"></i>
          </button>
        </div>

        <div class="flex items-center gap-3">
          <i data-lucide="globe" class="w-5 h-5 text-slate-400"></i>
          <input id="websiteInput" type="text" placeholder="输入网站/服务名称（可选）" class="flex-1 bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          <button id="saveBtn" class="flex items-center gap-2 px-4 py-3 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-xl hover:from-green-500 hover:to-emerald-500 transition-all shadow-lg shadow-green-500/25">
            <i data-lucide="save" class="w-5 h-5"></i>
            保存
          </button>
        </div>
      </div>

      <div class="p-6 space-y-6">
        <div>
          <div class="flex justify-between items-center mb-3">
            <label class="text-sm font-medium text-slate-300">密码长度</label>
            <span id="lengthValue" class="text-2xl font-bold text-blue-400 font-mono">16</span>
          </div>
          <input id="lengthSlider" type="range" min="4" max="64" value="16" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
        </div>

        <div>
          <label class="text-sm font-medium text-slate-300 mb-4 block">字符类型</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center gap-3 p-3 bg-slate-700/50 rounded-xl cursor-pointer hover:bg-slate-700 transition-colors">
              <input id="includeLower" type="checkbox" checked class="w-5 h-5 rounded accent-blue-500" />
              <span class="text-slate-200">小写字母 (a-z)</span>
            </label>
            <label class="flex items-center gap-3 p-3 bg-slate-700/50 rounded-xl cursor-pointer hover:bg-slate-700 transition-colors">
              <input id="includeUpper" type="checkbox" checked class="w-5 h-5 rounded accent-blue-500" />
              <span class="text-slate-200">大写字母 (A-Z)</span>
            </label>
            <label class="flex items-center gap-3 p-3 bg-slate-700/50 rounded-xl cursor-pointer hover:bg-slate-700 transition-colors">
              <input id="includeNumbers" type="checkbox" checked class="w-5 h-5 rounded accent-blue-500" />
              <span class="text-slate-200">数字 (0-9)</span>
            </label>
            <label class="flex items-center gap-3 p-3 bg-slate-700/50 rounded-xl cursor-pointer hover:bg-slate-700 transition-colors">
              <input id="includeSymbols" type="checkbox" checked class="w-5 h-5 rounded accent-blue-500" />
              <span class="text-slate-200">特殊符号</span>
            </label>
          </div>
        </div>

        <div>
          <label class="text-sm font-medium text-slate-300 mb-3 block">排除字符</label>
          <input id="excludeInput" type="text" placeholder="输入要排除的字符，例如: 0O1l" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
      </div>
    </div>

    <div id="historySection" class="mt-8 bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700 hidden">
      <div class="p-4 border-b border-slate-700 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="globe" class="w-5 h-5 text-slate-400"></i>
          <h2 class="text-lg font-semibold text-white">密码记录</h2>
          <span id="historyCount" class="text-sm text-slate-500">(0)</span>
        </div>
        <button id="clearHistoryBtn" class="flex items-center gap-2 px-3 py-1.5 text-sm text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg transition-colors">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
          清空
        </button>
      </div>
      <div id="historyList" class="max-h-[500px] overflow-y-auto"></div>
    </div>

    <div id="emptyState" class="mt-8 text-center py-12 hidden">
      <i data-lucide="globe" class="w-16 h-16 text-slate-600 mx-auto mb-4"></i>
      <p class="text-slate-500 text-lg">还没有保存任何密码</p>
      <p class="text-slate-600 text-sm mt-2">生成密码并添加网站名称即可保存</p>
    </div>
  </div>

  <script>
    const LOWERCASE = 'abcdefghijklmnopqrstuvwxyz';
    const UPPERCASE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const NUMBERS = '0123456789';
    const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';

    let state = {
      length: 16,
      includeLower: true,
      includeUpper: true,
      includeNumbers: true,
      includeSymbols: true,
      excludeChars: '',
      password: '',
      website: '',
      copied: false,
      history: [],
      editingId: null,
      editWebsite: ''
    };

    const generateId = () => {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(36).substr(2, 9)}-${Math.random().toString(36).substr(2, 9)}`;
    };

    const migrateHistory = (history) => {
      const seen = new Set();
      const result = [];
      history.forEach((record) => {
        if (seen.has(record.id)) {
          result.push({ ...record, id: generateId() });
        } else {
          seen.add(record.id);
          result.push(record);
        }
      });
      return result;
    };

    const loadHistory = () => {
      const savedHistory = localStorage.getItem('password-history');
      const VERSION = 'v1';
      const dataVersion = localStorage.getItem('password-data-version');
      
      let initialHistory = savedHistory ? JSON.parse(savedHistory) : [];
      
      if (dataVersion !== VERSION) {
        initialHistory = migrateHistory(initialHistory);
        localStorage.setItem('password-history', JSON.stringify(initialHistory));
        localStorage.setItem('password-data-version', VERSION);
      }
      
      return initialHistory;
    };

    const saveHistory = () => {
      localStorage.setItem('password-history', JSON.stringify(state.history));
    };

    const calculateStrength = (pwd) => {
      let score = 0;
      if (pwd.length >= 8) score++;
      if (pwd.length >= 12) score++;
      if (pwd.length >= 16) score++;
      if (/[a-z]/.test(pwd)) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^a-zA-Z0-9]/.test(pwd)) score++;
      
      if (score <= 2) return { label: '弱', color: 'bg-red-500' };
      if (score <= 4) return { label: '中等', color: 'bg-yellow-500' };
      if (score <= 6) return { label: '强', color: 'bg-blue-500' };
      return { label: '非常强', color: 'bg-green-500' };
    };

    const generatePassword = () => {
      let charset = '';
      if (state.includeLower) charset += LOWERCASE;
      if (state.includeUpper) charset += UPPERCASE;
      if (state.includeNumbers) charset += NUMBERS;
      if (state.includeSymbols) charset += SYMBOLS;

      for (const char of state.excludeChars) {
        charset = charset.split(char).join('');
      }

      if (!charset) {
        state.password = '';
        updateUI();
        return;
      }

      let result = '';
      const array = new Uint32Array(state.length);
      crypto.getRandomValues(array);
      
      for (let i = 0; i < state.length; i++) {
        result += charset[array[i] % charset.length];
      }

      state.password = result;
      updateUI();
      
      if (result) {
        const newRecord = {
          id: generateId(),
          password: result,
          website: state.website,
          createdAt: Date.now()
        };
        state.history = [newRecord, ...state.history];
        saveHistory();
        renderHistory();
      }
    };

    const copyPassword = async (pwd) => {
      try {
        await navigator.clipboard.writeText(pwd);
        state.copied = true;
        updateUI();
        setTimeout(() => {
          state.copied = false;
          updateUI();
        }, 2000);
      } catch (err) {
        console.error('Failed to copy:', err);
      }
    };

    const updateWebsite = (id, website) => {
      state.history = state.history.map((record) =>
        record.id === id ? { ...record, website } : record
      );
      saveHistory();
      renderHistory();
    };

    const clearHistory = () => {
      state.history = [];
      localStorage.removeItem('password-history');
      renderHistory();
    };

    const startEdit = (record) => {
      state.editingId = record.id;
      state.editWebsite = record.website;
      renderHistory();
    };

    const saveEdit = () => {
      if (state.editingId) {
        updateWebsite(state.editingId, state.editWebsite);
        state.editingId = null;
        state.editWebsite = '';
        renderHistory();
      }
    };

    const cancelEdit = () => {
      state.editingId = null;
      state.editWebsite = '';
      renderHistory();
    };

    const updateUI = () => {
      const passwordDisplay = document.getElementById('passwordDisplay');
      const lengthValue = document.getElementById('lengthValue');
      const strengthBar = document.getElementById('strengthBar');
      const strengthLabel = document.getElementById('strengthLabel');
      const copyBtn = document.getElementById('copyBtn');

      passwordDisplay.value = state.password;
      lengthValue.textContent = state.length;

      const strength = calculateStrength(state.password);
      strengthBar.className = `w-full h-2 rounded-full transition-all ${strength.color}`;
      strengthLabel.textContent = strength.label;

      copyBtn.innerHTML = state.copied 
        ? '<i data-lucide="check" class="w-6 h-6 text-green-500"></i>'
        : '<i data-lucide="copy" class="w-6 h-6 text-slate-400 group-hover:text-white"></i>';
      
      lucide.createIcons();
    };

    const renderHistory = () => {
      const historySection = document.getElementById('historySection');
      const emptyState = document.getElementById('emptyState');
      const historyCount = document.getElementById('historyCount');
      const historyList = document.getElementById('historyList');

      if (state.history.length === 0) {
        historySection.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      historySection.classList.remove('hidden');
      emptyState.classList.add('hidden');
      historyCount.textContent = `(${state.history.length})`;

      historyList.innerHTML = state.history.map((record) => `
        <div class="px-6 py-4 hover:bg-slate-700/50 transition-colors border-b border-slate-700/50 last:border-0">
          ${state.editingId === record.id ? `
            <div class="space-y-3">
              <div class="flex items-center gap-2">
                <i data-lucide="globe" class="w-4 h-4 text-blue-400"></i>
                <input type="text" id="editWebsiteInput-${record.id}" value="${state.editWebsite.replace(/"/g, '&quot;')}" class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="网站/服务名称" autofocus />
              </div>
              <div class="flex items-center gap-2">
                <span class="text-sm text-slate-500">密码:</span>
                <span class="font-mono text-slate-300">${record.password}</span>
              </div>
              <div class="flex gap-2">
                <button onclick="handleSaveEdit('${record.id}')" class="px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white text-sm rounded-lg transition-colors">保存</button>
                <button onclick="handleCancelEdit()" class="px-3 py-1.5 bg-slate-600 hover:bg-slate-500 text-white text-sm rounded-lg transition-colors">取消</button>
              </div>
            </div>
          ` : `
            <div class="space-y-2">
              <div class="flex items-start justify-between gap-4">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-2">
                    <i data-lucide="globe" class="w-4 h-4 text-blue-400 flex-shrink-0"></i>
                    <span class="font-semibold text-white truncate">${record.website || '未命名'}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-slate-300 break-all">${record.password}</span>
                  </div>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                  <button onclick="handleStartEdit('${record.id}')" class="p-2 hover:bg-slate-600 rounded-lg transition-colors" title="编辑网站名称">
                    <i data-lucide="edit-2" class="w-4 h-4 text-slate-400 hover:text-white"></i>
                  </button>
                  <button onclick="handleCopyPassword('${record.id}')" class="p-2 hover:bg-slate-600 rounded-lg transition-colors" title="复制密码">
                    <i data-lucide="copy" class="w-4 h-4 text-slate-400 hover:text-white"></i>
                  </button>
                </div>
              </div>
              <div class="text-xs text-slate-500">创建于 ${new Date(record.createdAt).toLocaleString('zh-CN')}</div>
            </div>
          `}
        </div>
      `).join('');
      
      lucide.createIcons();

      state.history.forEach((record) => {
        if (state.editingId === record.id) {
          const input = document.getElementById(`editWebsiteInput-${record.id}`);
          if (input) {
            input.addEventListener('input', (e) => {
              state.editWebsite = e.target.value;
            });
          }
        }
      });
    };

    window.handleStartEdit = (id) => {
      const record = state.history.find(r => r.id === id);
      if (record) startEdit(record);
    };

    window.handleSaveEdit = (id) => {
      const record = state.history.find(r => r.id === id);
      if (record) {
        state.editWebsite = document.getElementById(`editWebsiteInput-${id}`).value;
        saveEdit();
      }
    };

    window.handleCancelEdit = cancelEdit;

    window.handleCopyPassword = (id) => {
      const record = state.history.find(r => r.id === id);
      if (record) copyPassword(record.password);
    };

    const initEventListeners = () => {
      document.getElementById('lengthSlider').addEventListener('input', (e) => {
        state.length = Number(e.target.value);
        updateUI();
      });

      document.getElementById('includeLower').addEventListener('change', (e) => {
        state.includeLower = e.target.checked;
      });

      document.getElementById('includeUpper').addEventListener('change', (e) => {
        state.includeUpper = e.target.checked;
      });

      document.getElementById('includeNumbers').addEventListener('change', (e) => {
        state.includeNumbers = e.target.checked;
      });

      document.getElementById('includeSymbols').addEventListener('change', (e) => {
        state.includeSymbols = e.target.checked;
      });

      document.getElementById('excludeInput').addEventListener('input', (e) => {
        state.excludeChars = e.target.value;
      });

      document.getElementById('websiteInput').addEventListener('input', (e) => {
        state.website = e.target.value;
      });

      document.getElementById('generateBtn').addEventListener('click', generatePassword);
      
      document.getElementById('saveBtn').addEventListener('click', generatePassword);

      document.getElementById('copyBtn').addEventListener('click', () => {
        copyPassword(state.password);
      });

      document.getElementById('clearHistoryBtn').addEventListener('click', () => {
        if (confirm('确定要清空所有密码记录吗？')) {
          clearHistory();
        }
      });
    };

    const init = () => {
      state.history = loadHistory();
      initEventListeners();
      generatePassword();
      renderHistory();
    };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      init();
    });
  </script>
</body>
</html>
